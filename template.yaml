AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FarmAssist Agent - stateless Streamable HTTP MCP server on AWS Lambda (Function URL) with a single DynamoDB table.

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]{1,16}$'
    Description: Short name used in resource names, e.g. dev or demo.
  ApiTokenParameterName:
    Type: String
    Default: /farmassist/dev/api-token
    AllowedPattern: '^/[A-Za-z0-9/_.-]+$'
    Description: >
      Name of an existing SSM SecureString parameter holding the bearer token (at least 32 characters).
      CloudFormation cannot create SecureStrings, so create it first (see README).
  DemoFarmId:
    Type: String
    Default: demo-farm
    AllowedPattern: '^[A-Za-z0-9_-]{1,64}$'
    Description: The farm that the bearer token can read and write.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: Browser origins allowed to call the MCP endpoint (comma-separated).
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      Caps concurrent Lambda executions (cost and abuse guard). 0 leaves it unset; new AWS accounts often have a
      total limit of 10, which leaves no room to reserve any.

  BedrockModelId:
    Type: String
    Default: ''
    Description: >
      Bedrock model or inference profile id for weekly_insights narration, e.g.
      in.anthropic.claude-haiku-4-5-20251001-v1:0. Empty disables Bedrock (the tool then uses template text).
  BedrockRegion:
    Type: String
    Default: ap-south-1
    Description: Region of the Bedrock model or inference profile.
  BedrockRoleArn:
    Type: String
    Default: ''
    Description: >
      Optional IAM role to assume for Bedrock calls when Bedrock runs in a different AWS account.
      Empty means Bedrock is called with this function's own role in this account.

  AgentModelId:
    Type: String
    Default: ''
    Description: >
      Bedrock model or inference profile for the chat agent, e.g. apac.amazon.nova-lite-v1:0.
      Empty means the agent uses its deterministic command parser only.
  AgentBedrockRoleArn:
    Type: String
    Default: ''
    Description: >
      Optional IAM role in the Bedrock account that the chat function assumes to call AgentModelId.
      It must trust the ChatFunctionRoleArn output. Empty means Bedrock is called in this account.

  PhotoRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Photos sent for photo help are deleted automatically after this many days.
  KnowledgeEmbeddings:
    Type: String
    Default: 'off'
    AllowedValues: ['off', 'nova']
    Description: >
      'nova' adds Amazon Nova Multimodal Embeddings (us-east-1) to photo-help retrieval, through AgentBedrockRoleArn.
      Needs a built vector index and the model allowed for that role. 'off' uses keyword search only.

  CustomDomainName:
    Type: String
    Default: ''
    Description: >
      Optional domain for the web client, e.g. farmassist.mobil80.com. Empty serves it on the Function URL only.
      Needs CustomDomainCertificateArn and CustomDomainHostedZoneId.
  CustomDomainCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate for CustomDomainName. CloudFront requires it to be in us-east-1.
  CustomDomainHostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 public hosted zone that holds CustomDomainName.

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  HasAgentModel: !Not [!Equals [!Ref AgentModelId, '']]
  HasAgentRole: !Not [!Equals [!Ref AgentBedrockRoleArn, '']]
  AgentUsesBedrockInThisAccount: !And [!Condition HasAgentModel, !Not [!Condition HasAgentRole]]
  AgentUsesBedrockRole: !And [!Condition HasAgentModel, !Condition HasAgentRole]
  HasBedrockModel: !Not [!Equals [!Ref BedrockModelId, '']]
  HasBedrockRole: !Not [!Equals [!Ref BedrockRoleArn, '']]
  UsesBedrockInThisAccount: !And [!Condition HasBedrockModel, !Not [!Condition HasBedrockRole]]
  UsesBedrockRole: !And [!Condition HasBedrockModel, !Condition HasBedrockRole]
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]

Resources:
  LedgerTable:
    Type: AWS::DynamoDB::Table
    # Farm records are never deleted with the stack by accident. Delete the table by hand after the demo.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub farmassist-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  McpFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/farmassist-mcp-${StageName}
      RetentionInDays: 14

  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub farmassist-mcp-${StageName}
      Description: FarmAssist MCP server (Streamable HTTP, stateless, JSON responses)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: handler.handler
      CodeUri: .
      MemorySize: 512
      # Up to two Bedrock calls for weekly_insights; every other tool answers in well under a second.
      Timeout: 30
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref McpFunctionLogGroup
        LogFormat: Text
      Environment:
        Variables:
          FARMASSIST_TABLE_NAME: !Ref LedgerTable
          FARMASSIST_TOKEN_PARAMETER: !Ref ApiTokenParameterName
          FARMASSIST_DEMO_FARM_ID: !Ref DemoFarmId
          ALLOWED_ORIGINS: !Join [',', !Ref AllowedOrigins]
          # Lets signed-up web users reach their own farm with their own (verified) ID token.
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          NODE_OPTIONS: --enable-source-maps
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_ROLE_ARN: !Ref BedrockRoleArn
      # Auth is the bearer token checked in code (src/auth/bearer.ts); the URL itself is public.
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: !Ref AllowedOrigins
          AllowMethods: [POST]
          AllowHeaders: [content-type, accept, authorization, mcp-protocol-version, last-event-id]
          MaxAge: 300
      Policies:
        - Version: '2012-10-17'
          Statement:
            # Least privilege: exactly the item operations the repository uses (TransactWriteItems is
            # authorised through the Put/Update permissions of the items it writes).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt LedgerTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiTokenParameterName}
            # Bedrock in this account: the configured inference profile, plus the foundation models it routes
            # to (a cross-region profile can use any region in its geography).
            - !If
              - UsesBedrockInThisAccount
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
              - !Ref AWS::NoValue
            # Bedrock in another account: only assume that one role.
            - !If
              - UsesBedrockRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockRoleArn
              - !Ref AWS::NoValue
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda/handler.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: node22
        Platform: node
        Minify: false
        Sourcemap: true
        # Some bundled dependencies still call require(); give ESM output a working one.
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);

  # ---- Web client sign-in ----------------------------------------------------------------------------

  # Two kinds of users: admin-created ones carry a farmId they cannot change (e.g. the demo farm); people
  # who sign up themselves (email code) get a private farm of their own (src/auth/cognito-farm.ts).
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub farmassist-${StageName}
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes: [email]
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your FarmAssist Agent code
        EmailMessage: 'Your FarmAssist Agent verification code is {####}. It expires in 24 hours.'
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireNumbers: true
          RequireLowercase: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      Schema:
        - Name: farmId
          AttributeDataType: String
          Mutable: false
          StringAttributeConstraints:
            MinLength: '1'
            MaxLength: '64'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub farmassist-web-${StageName}
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      ReadAttributes: [name, email, email_verified, custom:farmId]
      # custom:farmId is deliberately not writable by users (so a sign-up can never pick someone's farm).
      WriteAttributes: [name, email]

  # ---- Photos for photo help -----------------------------------------------------------------------

  # Private, encrypted, deleted after PhotoRetentionDays. Kept on stack deletion (it may hold farm photos).
  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: delete-old-photos
            Status: Enabled
            ExpirationInDays: !Ref PhotoRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt PhotoBucket.Arn, !Sub '${PhotoBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---- Hosted chat backend + web client ------------------------------------------------------------

  ChatFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/farmassist-chat-${StageName}
      RetentionInDays: 14

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub farmassist-chat-${StageName}
      Description: FarmAssist web client and chat backend (MCP client + agent)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: handler.handler
      CodeUri: .
      MemorySize: 512
      # A turn can take a few model and tool round trips.
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ChatFunctionLogGroup
        LogFormat: Text
      Environment:
        Variables:
          FARMASSIST_TABLE_NAME: !Ref LedgerTable
          FARMASSIST_TOKEN_PARAMETER: !Ref ApiTokenParameterName
          FARMASSIST_DEMO_FARM_ID: !Ref DemoFarmId
          FARMASSIST_MCP_URL: !Sub '${McpFunctionUrl.FunctionUrl}mcp'
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          AGENT_MODEL_ID: !Ref AgentModelId
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_ROLE_ARN: !Ref AgentBedrockRoleArn
          PHOTO_BUCKET: !Ref PhotoBucket
          KNOWLEDGE_EMBEDDINGS: !Ref KnowledgeEmbeddings
          NODE_OPTIONS: --enable-source-maps
      # Page and API share this one origin, so no CORS is needed. API calls are checked against Cognito in code.
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Version: '2012-10-17'
          Statement:
            # Conversation memory only (CONV# items). Farm records are reached through the MCP server, never directly.
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt LedgerTable.Arn
            # Photo help: write new photos only (no read, list or delete).
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${PhotoBucket.Arn}/photos/*'
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiTokenParameterName}
            - !If
              - AgentUsesBedrockInThisAccount
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${AgentModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
              - !Ref AWS::NoValue
            - !If
              - AgentUsesBedrockRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref AgentBedrockRoleArn
              - !Ref AWS::NoValue
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/chat/handler.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: node22
        Platform: node
        Minify: false
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);

  # ---- Custom domain for the web client --------------------------------------------------------------

  # Function URLs cannot take a custom domain, so CloudFront fronts the chat function. Nothing is cached, and
  # every header except Host is forwarded (the Function URL only answers to its own host name).
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasCustomDomain
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub FarmAssist web client (${StageName})
        Aliases: [!Ref CustomDomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref CustomDomainCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: chat-function
            DomainName: !Select [2, !Split ['/', !GetAtt ChatFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              # Matches the function timeout (a chat turn can take several model round trips).
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: chat-function
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  WebDomainRecordIPv4:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref CustomDomainHostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed zone for alias records

  WebDomainRecordIPv6:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref CustomDomainHostedZoneId
      Name: !Ref CustomDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt WebDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  WebAppUrl:
    Description: The FarmAssist web client (sign in with a Cognito user, see README)
    Value: !GetAtt ChatFunctionUrl.FunctionUrl
  CustomDomainUrl:
    Condition: HasCustomDomain
    Description: The web client on the custom domain
    Value: !Sub https://${CustomDomainName}/
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ChatFunctionRoleArn:
    Description: Role the chat function runs as. The Bedrock account's role must trust this ARN.
    Value: !GetAtt ChatFunctionRole.Arn
  McpEndpoint:
    Description: Streamable HTTP MCP endpoint
    Value: !Sub '${McpFunctionUrl.FunctionUrl}mcp'
  TableName:
    Description: DynamoDB table holding the farm ledger
    Value: !Ref LedgerTable
  FunctionName:
    Value: !Ref McpFunction
  FunctionRoleArn:
    Description: Role the MCP function runs as. Trust this ARN from a Bedrock role in another account.
    Value: !GetAtt McpFunctionRole.Arn
